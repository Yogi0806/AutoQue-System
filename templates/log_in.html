{% extends 'base.html' %}
{% block title %}LogIn{% endblock title %}
{% block body %}
<style>
    /* CSS for background and button color */
    .contact {
        position: relative;
        width: 100%;
        height: 100vh; /* Set height of section to full viewport height */
        color: #fff; /* Set text color to white */
    }

    .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensure the video covers the entire container */
    }

    .container {
        position: relative;
        z-index: 1; /* Ensure the content appears above the video background */
    }

    .btn-login {
        background-color: #cc1ef7; /* Set button background color */
        color: #fff; /* Set button text color */
    }
</style>

<!-- ======= LogIn Section ======= -->
<section id="contact" class="contact">
    <video autoplay muted loop class="video-bg">
        <source src="static/img/background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="container">
        <div class="row mt-5 justify-content-center m-auto">
            <div class="col-lg-4 m-auto">
                <div class="pic mt-5"><img src="static\img\login_gif1.gif" class="img-fluid" alt=""></div>
            </div>
            <div class="col-lg-4 mt-5 mt-lg-0 m-auto">
                <form action="" method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between align-items-center">
                        <h2>Log In</h2>
                        <div class="pic"><img style="height: 80px;" src="static/img/user.png" class="img-fluid" alt=""></div>
                    </div>
                    <div class="form-group mt-3">
                        <label class="form-group" for="username">Email</label>
                        <input type="email" class="form-control" name="username" id="username" placeholder="Enter your Email" required>
                    </div>
                    <div class="form-group mt-3">
                        <label class="form-group" for="password">Password</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
                    </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-login" type="submit">Log In</button> <!-- Apply btn-login class for button -->
                    </div>
                    <div class="form-group mt-3">
                        <p>Don't have an Account ? <a href="register"> Register Now</a> </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section><!-- End Log In Section -->
{% endblock body %}
