{% extends 'base.html' %}
{% block title %}Register{% endblock title %}
{% block body %}
<style>
    /* CSS for full-screen video */
    .contact {
        position: relative;
        width: 100%;
        height: 100vh; /* Set height of section to full viewport height */
        color: #fff; /* Set text color to white */
    }

    .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensure the video covers the entire container */
    }

    .container {
        position: relative;
        z-index: 1; /* Ensure the form appears above the video */
    }

    /* Additional styling to move the form down */
    .form-container {
        margin-top: 50px; /* Adjust the top margin as needed */
    }

    /* Style for the Register button */
    .btn-register {
        background-color: #cc1ef7; /* Set background color to blue */
        color: white; /* Set text color to white */
    }
</style>

<section id="contact" class="contact">
    <video autoplay muted loop class="video-bg">
        <source src="static/img/background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="container">
        <div class="row mt-5">
            <div class="col-lg-4 mt-lg-0 m-auto form-container"> <!-- Added form-container class here -->
                <form action="" method="post">
                    {% csrf_token %}

                    <div class="d-flex justify-content-between align-items-center">
                        <h2>Registration Form</h2>
                    </div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label class="form-group" for="fname">First Name</label>
                            <input type="text" name="fname" class="form-control" id="fname" placeholder="First Name"
                                required>
                        </div>
                        <div class="col-md-6 form-group mt-3 mt-md-0">
                            <label class="form-group" for="lname">Last Name</label>
                            <input type="text" class="form-control" name="lname" id="lname" placeholder="Last Name"
                                required>
                        </div>
                    </div>
                    <div class="form-group mt-3">
                        <label class="form-group" for="username">Email</label>
                        <input type="email" class="form-control" name="username" id="username"
                            placeholder="Enter your Email" required>
                    </div>
                    <div class="form-group mt-3">
                        <label class="form-group" for="password">Password</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="Password"
                            required>
                    </div>
                    <div class="form-group mt-3">
                        <label class="form-group" for="password1">Re-enter Password</label>
                        <input type="password" class="form-control" name="password1" id="password1" placeholder="Re-enter Password"
                            required>
                    </div>

                    <div class="text-center mt-3">
                        <button class="btn btn-register" type="submit">Register</button> <!-- Added btn-register class here -->
                    </div>
                    
                </form>
            </div>
            <div class="col-lg-4 m-auto">
                <div class="pic mt-5"><img src="static\img\logo_test2.gif" class="img-fluid" alt=""></div>
            </div>
        </div>
    </div>
</section><!-- End Log In Section -->

{% endblock body %}
